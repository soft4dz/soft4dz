<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Soft4dz — carte produit</title>
<!-- Même composant que la carte du canevas Claude Design « Soft4dz — Cartes produits » (Card.dc.html),
     rendu plein cadre 400×300 puis exporté ×3 (1200×900) par generate.mjs. -->
<style>
  @font-face { font-family: 'Rubik'; src: url(fonts/rubik-latin.woff2) format('woff2'); font-weight: 300 900; }
  @font-face { font-family: 'Nunito Sans'; src: url(fonts/nunitosans-latin.woff2) format('woff2'); font-weight: 200 1000; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 300px; overflow: hidden; }
  body { font-family: 'Rubik', sans-serif; }

  .card { position: relative; width: 400px; height: 300px; overflow: hidden; background: var(--bg); color: var(--ink); }
  .watermark { position: absolute; right: -46px; bottom: -58px; width: 230px; height: 230px; opacity: var(--wm); transform: rotate(-12deg); }
  .sheen { position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 42%); }
  /* Contenu ancré en bas : le haut reste libre pour les badges du site (promo, INSTANT) et le recadrage des vignettes */
  .content { position: relative; height: 100%; padding: 24px 26px 30px; display: flex; flex-direction: column; justify-content: flex-end; }
  .logo { width: 54px; height: 54px; margin-bottom: 16px; filter: drop-shadow(0 4px 12px rgba(0,0,0,.25)); }
  .tile { width: 54px; height: 54px; margin-bottom: 16px; border-radius: 15px; padding: 13px; background: var(--tile); box-shadow: inset 0 0 0 1px var(--edge); }
  .tile .glyph { width: 28px; height: 28px; }
  .glyph svg, .watermark svg, .logo svg { width: 100%; height: 100%; display: block; }
  .mark { display: flex; align-items: center; gap: 6px; opacity: .92; }
  .mark img { height: 22px; display: block; }
  .mark span { font-family: 'Nunito Sans', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: .1em; }
  .label { font-family: 'Nunito Sans', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .8; }
  .brand { margin-top: 6px; font-weight: 800; line-height: 1.04; letter-spacing: -.02em; max-width: 270px; }
  .foot { margin-top: 14px; height: 24px; display: flex; justify-content: space-between; align-items: center; }
  .meta { display: flex; align-items: center; gap: 12px; }
  .signature { display: flex; gap: 5px; }
  .signature i { display: block; width: 26px; height: 4px; border-radius: 4px; }
  .signature i:first-child { background: linear-gradient(90deg, #7ee0c0, #4a7fc0); }
  .signature i:last-child { background: linear-gradient(90deg, #b0204a, #e8902a); }
  .badge { font-family: 'Nunito Sans', sans-serif; font-weight: 900; font-size: 12px; padding: 4px 11px; border-radius: 999px; background: var(--ink); color: var(--bg1); }
  .badge:empty, [hidden] { display: none; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="watermark" id="watermark"></div>
    <div class="sheen"></div>
    <div class="content">
      <div class="logo" id="logo"></div>
      <div class="tile" id="tile"><div class="glyph" id="tileGlyph"></div></div>
      <div class="label" id="label"></div>
      <div class="brand" id="brand"></div>
      <div class="foot">
        <div class="meta"><div class="signature"><i></i><i></i></div><span class="badge" id="badge"></span></div>
        <div class="mark"><img src="../../assets/images/logo-soft4dz.png" alt=""><span>SOFT4DZ</span></div>
      </div>
    </div>
  </div>
<script>
  /** Appelé par generate.mjs : mêmes règles que renderVals() de Card.dc.html. */
  window.render = async ({ brand, label, bg, ink, glyphSvg, logo, badge }) => {
    const light = ink.toLowerCase() !== '#ffffff';
    const s = document.getElementById('card').style;
    s.setProperty('--bg', `linear-gradient(135deg, ${bg[0]} 0%, ${bg[1]} 100%)`);
    s.setProperty('--bg1', bg[0]);
    s.setProperty('--ink', ink);
    s.setProperty('--wm', light ? .08 : (logo ? .14 : .1));
    s.setProperty('--tile', light ? 'rgba(0,0,0,.06)' : 'rgba(255,255,255,.14)');
    s.setProperty('--edge', light ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.16)');

    document.getElementById('watermark').innerHTML = glyphSvg;
    const logoEl = document.getElementById('logo');
    logoEl.innerHTML = logo ? glyphSvg : '';
    logoEl.hidden = !logo; // visible avant la mesure : getBBox() vaut 0 sur un élément masqué
    if (logo) {
      // Recadrage au plus juste puis taille « optique » : même surface quelle que soit la forme du logo
      const svg = logoEl.querySelector('svg');
      const bb = svg.getBBox();
      svg.setAttribute('viewBox', `${bb.x} ${bb.y} ${bb.width} ${bb.height}`);
      const ratio = bb.width / bb.height;
      let h = Math.min(50, Math.sqrt(2400 / ratio));
      let w = h * ratio;
      if (w > 150) { w = 150; h = w / ratio; }
      logoEl.style.width = w + 'px';
      logoEl.style.height = h + 'px';
    }
    document.getElementById('tileGlyph').innerHTML = logo ? '' : glyphSvg;
    document.getElementById('tile').hidden = logo;
    document.getElementById('label').textContent = label;
    document.getElementById('badge').textContent = badge || '';
    const el = document.getElementById('brand');
    el.textContent = brand;
    const len = brand.length;
    el.style.fontSize = (len <= 9 ? 34 : len <= 12 ? 30 : len <= 15 ? 27 : 25) + 'px';
    await document.fonts.ready;
  };
</script>
</body>
</html>
